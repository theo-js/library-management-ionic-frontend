<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>{{ DEFAULT_TITLE }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list [inset]="true">
      <ion-list-header class="ion-padding">
        <ion-avatar>
          <img
            alt=""
            src="https://images.unsplash.com/photo-1715615751025-e7ebe7f47eea?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
          />
        </ion-avatar>
      </ion-list-header>

      @for (navLink of NAV_LINKS; track navLink.href) {
        <ion-item [routerLink]="navLink.href" routerLinkActive="item-active" (click)="closeMenu()">
          <ion-label>{{ navLink.title }}</ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" color="inherit"></ion-icon>
        </ion-item>
      }
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  @if (isNavigating()) {
    <ion-progress-bar type="indeterminate" slot="start" />
  }

  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>{{ title() }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
