<ion-card>
  <img
    alt="Silhouette of mountains"
    src="https://images.icon-icons.com/3361/PNG/512/multimedia_communication_image_placeholder_photography_landscape_image_comics_picture_photo_gallery_image_icon_210828.png"
  />
  <ion-card-header>
    <ion-card-title> {{ book().title }}</ion-card-title>
    <ion-card-subtitle>{{ book().author }} · {{ book().isbnNumber }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <ion-label>{{ book().copies.length }} copies</ion-label>
  </ion-card-content>
</ion-card>
